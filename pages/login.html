<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <title>The-Last-Stand</title>
</head>

<body>
    <!-- <h1>Login</h1> -->
    <div style="max-width:520px;margin:28px auto">
        <div class="card">
            <h2>Login</h2>
            <form id="loginForm" class="form-grid">
                <label class="label">Username</label>
                <input id="username" name="username" type="text" required class="input">
                <label class="label">Password</label>
                <input id="password" name="password" type="password" required class="input" placeholder="*******">
                <div class="form-actions">
                    <button id="loginBtn" class="btn" type="submit">Login</button>
                    <button id="registerBtn" type="button">Register</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/src/api/api.js"></script>
    <script type="module" src="/src/auth/authentication.js"></script>
</body>

</html>
