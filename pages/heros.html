<!DOCTYPE html>

    <title>Heroes</title>

<body>
    <div id="heroesGrid">
        <div id="heroesContainer">
            <h1>HEROES:</h1>
            <ul id="heros"></ul>
        </div>

        <div id="heroInfoContainer">
            <h1 id="heroName">SELECT A HERO</h1>

            <table id="heroTable">
                <thead>
                    <th>STATS:</th>
                </thead>
                <tbody id="stats">
                    <tr>
                        <td>HEALTH</td>
                        <td id="health"></td>
                    </tr>
                    <tr>
                        <td>MANA</td>
                        <td id="mana"></td>
                    </tr>
                </tbody>
                <thead>
                    <th>ABILITIES:</th>
                </thead>
                <tbody>
                    <tr>
                        <td>PASSIVE</td>
                        <td id="passive"></td>
                    </tr>
                    <tr>
                        <td>PRIMARY</td>
                        <td id="primary"></td>
                    </tr>
                    <tr>
                        <td>SECONDARY</td>
                        <td id="secondary"></td>
                    </tr>
                    <tr>
                        <td>TERTIARY</td>
                        <td id="tertiary"></td>
                    </tr>
                    <tr>
                        <td>ULTIMATE</td>
                        <td id="ultimate"></td>
                    </tr>
                </tbody>
                <thead>
                    <th>HISTORY:</th>
                </thead>
                <tbody>
                    <tr>
                        <td>WINS</td>
                        <td id="wins"></td>
                    </tr>
                    <tr>
                        <td>LOSES</td>
                        <td id="loses"></td>
                    </tr>
                </tbody>
            </table>
